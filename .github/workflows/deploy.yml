name: Build & deploy (GitHub Pages)

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # URL publique de la fonction contact (variable de dépôt, pas un secret)
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_ENDPOINT }}
          # Tant que la variable de dépôt CUSTOM_DOMAIN n'est pas définie, le site est servi
          # sur fda-studio.github.io/fda-studio-site/ : on préfixe les URL en conséquence.
          NEXT_PUBLIC_BASE_PATH: ${{ vars.CUSTOM_DOMAIN == '' && '/fda-studio-site' || '' }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: out

  # Seule la branche main est publiée ; les autres branches ne font qu'une compilation de contrôle.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
